# Stories of epic-astro-site-parity. Table order is build order. `id` is permanent, never reused.

[[entry]]
id = 1
type = "story"
title = "Astro scaffold builds the English home hero through CI"
description = "Creates the Astro project with the spine's tooling (EditorConfig, Prettier, ESLint, strict TypeScript), tokens, BaseLayout, routes and i18n skeleton, and a home page with the hero only; CI runs check, lint, format, build and the dist check without deploying."
verify = "On a pull request CI is green, and npm run preview shows the English hero at / built from src/, with the legacy site untouched in production."
covers = ["R1", "R5", "R6"]
after = []
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Spanish twins, head tags and legacy links work"
description = "Adds /es/ wrappers, routes.ts href and twin, BaseLayout canonical, hreflang, Open Graph and the inline script (?lang=es redirect, js class), the i18n sitemap and robots.txt, and public/assets at stable paths."
verify = "The build has / and /es/ with correct canonical and hreflang, /?lang=es opens /es/, sitemap-index.xml lists both, and /assets/cv-donato-ayala.pdf resolves in preview."
covers = ["R3", "R4", "R8"]
after = [1]
hitl = false
risk = "high"

