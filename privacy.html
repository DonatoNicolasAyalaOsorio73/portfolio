<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="canonical" href="https://donacode.link/privacy.html">
<title>Privacy Policy — Donato Ayala</title>
<meta name="description" content="Privacy policy for donacode.link, the portfolio of Donato Nicolás Ayala Osorio.">
<style>
html,body{margin:0;background:#FFFFFF;color:#111111;font-family:-apple-system,BlinkMacSystemFont,system-ui,ui-sans-serif,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
*{box-sizing:border-box}
a{color:#111111;text-decoration:underline;text-underline-offset:3px}
a:hover{color:#6E6E73}
</style>
</helmet>
<header style="position:sticky;top:0;z-index:10;display:flex;justify-content:center;padding:14px 16px;background:rgba(255,255,255,0.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,0.06)">
  <div style="width:100%;max-width:820px;display:flex;justify-content:space-between;align-items:center;gap:12px">
    <a href="./" style="font-weight:700;font-size:16px;letter-spacing:-0.02em;text-decoration:none">← Donato Ayala</a>
    <div role="group" aria-label="Language" style="display:flex;padding:3px;border-radius:999px;background:rgba(0,0,0,0.05)">
      <sc-for list="{{ langs }}" as="g" hint-placeholder-count="2">
        <button onClick="{{ g.set }}" aria-pressed="{{ g.active }}" style="font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:0;border-radius:999px;padding:7px 12px;background:{{ g.bg }};color:{{ g.fg }};box-shadow:{{ g.shadow }}">{{ g.label }}</button>
      </sc-for>
    </div>
  </div>
</header>
<main style="max-width:820px;margin:0 auto;padding:clamp(64px,10vw,120px) 20px 120px">
  <div style="font-size:14px;letter-spacing:0.14em;font-weight:600;color:#6E6E73">{{ c.eyebrow }}</div>
  <h1 style="font-size:clamp(2.4rem,6vw,4.5rem);line-height:1;letter-spacing:-0.05em;font-weight:800;margin:16px 0 0">{{ c.title }}</h1>
  <p style="font-size:clamp(17px,2vw,19px);line-height:1.6;color:#3A3A3C;margin:28px 0 0;text-wrap:pretty">{{ c.lead }}</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin-top:36px">
    <sc-for list="{{ c.facts }}" as="f" hint-placeholder-count="4">
      <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:16px;background:#F5F5F7;font-size:15px;font-weight:500"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>{{ f }}</div>
    </sc-for>
  </div>
  <nav aria-label="{{ c.tocLabel }}" style="margin-top:48px">
    <div style="font-size:14px;letter-spacing:0.12em;font-weight:600;color:#6E6E73">{{ c.tocLabel }}</div>
    <ol style="list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:6px 24px;font-size:15px">
      <sc-for list="{{ c.sections }}" as="s" hint-placeholder-count="12">
        <li style="display:flex;gap:10px"><span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#6E6E73;padding-top:2px">{{ s.n }}</span><a href="{{ s.href }}" style="text-decoration:none" style-hover="text-decoration:underline">{{ s.h }}</a></li>
      </sc-for>
    </ol>
  </nav>
  <div style="display:flex;flex-direction:column;margin-top:48px">
    <sc-for list="{{ c.sections }}" as="s" hint-placeholder-count="12">
      <section id="{{ s.id }}" style="display:grid;grid-template-columns:minmax(0,40px) minmax(0,1fr);gap:12px;padding:28px 0;border-top:1px solid rgba(0,0,0,0.08);scroll-margin-top:80px">
        <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#6E6E73;padding-top:6px">{{ s.n }}</span>
        <div style="min-width:0">
          <h2 style="font-size:22px;letter-spacing:-0.02em;font-weight:700;margin:0">{{ s.h }}</h2>
          <sc-for list="{{ s.ps }}" as="p" hint-placeholder-count="2">
            <p style="font-size:16px;line-height:1.65;color:#3A3A3C;margin:12px 0 0;text-wrap:pretty;overflow-wrap:anywhere">{{ p }}</p>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>
  <p style="font-size:14px;line-height:1.6;color:#6E6E73;margin:40px 0 0;padding-top:24px;border-top:1px solid rgba(0,0,0,0.08)">{{ c.updated }}</p>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
const E = 'donatonicolasosorio@gmail.com';
const C = {
  en: { eyebrow: 'LEGAL', title: 'Privacy policy.', tocLabel: 'CONTENTS', updated: 'Effective date: September 29, 2026. Version 2.0. The English version prevails for readers outside Colombia; the Spanish version prevails for readers in Colombia.',
    lead: 'This policy explains how donacode.link, the personal portfolio of Donato Nicolás Ayala Osorio, handles personal data. It is written to comply with Colombian Law 1581 of 2012 and Decree 1377 of 2013 (incorporated into Decree 1074 of 2015), and with the EU General Data Protection Regulation (GDPR) where it applies.',
    facts: ['No analytics or ad trackers', 'No cookies', 'No accounts or server-side forms', 'Your data is never sold'],
    sections: [
      ['Data controller', [`The controller of any personal data processed through this site is Donato Nicolás Ayala Osorio, an individual based in Colombia ("I", "me"). Contact: ${E}.`, 'This is a personal, non-commercial portfolio. It does not sell products or services online.']],
      ['Scope', ['This policy covers the website at donacode.link and its subpages. It does not cover third-party sites linked from here, which are governed by their own policies.']],
      ['Data I process', ['Technical data: when you load a page, the hosting provider automatically receives standard request data (IP address, user agent, requested URL, referrer, date and time). I do not use this data to identify you or build profiles.', 'Data you choose to send: if you contact me by email or WhatsApp, I receive what you include in the message, such as your name, email address or phone number, and the content of your message.', 'I do not intentionally collect sensitive data (as defined in Article 5 of Law 1581 and Article 9 of the GDPR). Please do not include it in your messages.']],
      ['The contact form', ['The "Send an email" window runs entirely in your browser. When you press send, it opens your own email client or Gmail with the subject and message pre-filled. The text is not transmitted to, or stored on, any server operated by me. Nothing is sent until you confirm it in your email client.']],
      ['Cookies and local storage', ['This site sets no cookies. It stores one value in your browser\'s localStorage: your language preference (EN or ES). That value never leaves your device, is not used for tracking, and can be cleared at any time from your browser settings. Because it is strictly necessary to deliver a feature you requested, it does not require consent under the ePrivacy Directive.']],
      ['Purposes and legal bases', ['Serving and securing the site (technical data): legitimate interest in operating a secure, functioning website (GDPR Art. 6(1)(f)).', 'Replying to your message: your request and my legitimate interest in answering it, or steps taken at your request before entering into a contract (GDPR Art. 6(1)(b) and (f)). Under Colombian law, by contacting me you authorize processing for this purpose only (Law 1581, Art. 9).', 'I do not use your data for marketing, automated decision-making or profiling.']],
      ['Processors and international transfers', ['The site is hosted on GitHub Pages (GitHub, Inc., United States). Email is handled through Google (Gmail) and messaging through WhatsApp (Meta Platforms). These providers may process data outside Colombia and the European Economic Area.', 'Where they do, transfers rely on the safeguards those providers offer, such as Standard Contractual Clauses or the EU-U.S. Data Privacy Framework, and on the international-transfer rules of Law 1581 (Art. 26).']],
      ['Retention', ['Hosting logs are kept by the hosting provider according to its own retention policy. Correspondence is kept only as long as needed to handle your request or any follow-up (for example, a hiring process or a project), and is deleted on request unless I am legally required to keep it.']],
      ['Security', ['The site is served over HTTPS only. It has no database, no user accounts and no server-side code that stores personal data. Access to my email and messaging accounts is protected with strong authentication.']],
      ['Your rights', ['Under Colombian law you have the right to know, update and rectify your data; request proof of your authorization; be informed about how your data has been used; revoke your authorization or request deletion; access your data free of charge; and file a complaint with the Superintendencia de Industria y Comercio (SIC).', 'If the GDPR applies to you, you also have the right of access, rectification, erasure, restriction, data portability and objection, the right to withdraw consent at any time, and the right to lodge a complaint with your local data protection authority.']],
      ['How to exercise your rights', [`Email ${E} with the subject "Data request" and describe what you need. I may ask for information to verify your identity.`, 'Queries are answered within 10 business days and complaints within 15 business days, as required by Articles 14 and 15 of Law 1581. For GDPR requests, I respond within one month.']],
      ['Children', ['This site is not directed at children under 14 (Colombia) or under 16 (EU), and I do not knowingly collect their data. If you believe a minor has sent me personal data, contact me and I will delete it.']],
      ['External links', ['Project demos, repositories, certificates and profiles open on third-party sites such as Vercel, GitHub, LinkedIn, Credly, freeCodeCamp and Google Drive. Their privacy practices are their own.']],
      ['Changes to this policy', ['If this policy changes materially, I will publish the new version on this page with a new effective date and version number.']],
    ] },
  es: { eyebrow: 'LEGAL', title: 'Política de privacidad.', tocLabel: 'CONTENIDO', updated: 'Vigente desde el 29 de septiembre de 2026. Versión 2.0. Para lectores en Colombia prevalece la versión en español; fuera de Colombia, la versión en inglés.',
    lead: 'Esta política explica cómo donacode.link, el portafolio personal de Donato Nicolás Ayala Osorio, trata los datos personales. Está redactada conforme a la Ley 1581 de 2012 y el Decreto 1377 de 2013 (compilado en el Decreto 1074 de 2015) y, cuando aplica, al Reglamento General de Protección de Datos de la Unión Europea (RGPD).',
    facts: ['Sin analítica ni rastreadores publicitarios', 'Sin cookies', 'Sin cuentas ni formularios en servidor', 'Tus datos nunca se venden'],
    sections: [
      ['Responsable del tratamiento', [`El responsable de los datos personales tratados a través de este sitio es Donato Nicolás Ayala Osorio, persona natural domiciliada en Colombia. Contacto: ${E}.`, 'Este es un portafolio personal sin fines comerciales. No vende productos ni servicios en línea.']],
      ['Alcance', ['Esta política aplica al sitio donacode.link y sus subpáginas. No cubre los sitios de terceros enlazados desde aquí, que se rigen por sus propias políticas.']],
      ['Datos que trato', ['Datos técnicos: al cargar una página, el proveedor de hosting recibe automáticamente datos estándar de la solicitud (dirección IP, navegador, URL solicitada, referente, fecha y hora). No uso estos datos para identificarte ni crear perfiles.', 'Datos que decides enviar: si me contactas por correo o WhatsApp, recibo lo que incluyas en el mensaje, como tu nombre, correo o teléfono, y el contenido del mensaje.', 'No recopilo de forma intencional datos sensibles (según el artículo 5 de la Ley 1581 y el artículo 9 del RGPD). Por favor no los incluyas en tus mensajes.']],
      ['El formulario de contacto', ['La ventana "Enviar correo" funciona por completo en tu navegador. Al enviar, abre tu propio cliente de correo o Gmail con el asunto y el mensaje ya escritos. El texto no se transmite ni se guarda en ningún servidor operado por mí. Nada se envía hasta que lo confirmes en tu cliente de correo.']],
      ['Cookies y almacenamiento local', ['Este sitio no instala cookies. Guarda un solo valor en el localStorage de tu navegador: tu preferencia de idioma (EN o ES). Ese valor nunca sale de tu dispositivo, no se usa para rastreo y puedes borrarlo en cualquier momento desde la configuración del navegador. Al ser estrictamente necesario para una función que solicitaste, no requiere consentimiento según la Directiva ePrivacy.']],
      ['Finalidades y bases legales', ['Prestar y proteger el sitio (datos técnicos): interés legítimo en operar un sitio seguro y funcional (art. 6.1.f RGPD).', 'Responder tu mensaje: tu solicitud y mi interés legítimo en contestarla, o medidas precontractuales a petición tuya (art. 6.1.b y 6.1.f RGPD). Conforme a la ley colombiana, al contactarme autorizas el tratamiento únicamente para esta finalidad (Ley 1581, art. 9).', 'No uso tus datos para marketing, decisiones automatizadas ni elaboración de perfiles.']],
      ['Encargados y transferencias internacionales', ['El sitio está alojado en GitHub Pages (GitHub, Inc., Estados Unidos). El correo se gestiona con Google (Gmail) y la mensajería con WhatsApp (Meta Platforms). Estos proveedores pueden tratar datos fuera de Colombia y del Espacio Económico Europeo.', 'En ese caso, las transferencias se amparan en las garantías que ofrecen dichos proveedores, como Cláusulas Contractuales Tipo o el Marco de Privacidad de Datos UE-EE. UU., y en las reglas de transferencia internacional de la Ley 1581 (art. 26).']],
      ['Conservación', ['Los registros del hosting se conservan según la política de retención del proveedor. La correspondencia se conserva solo el tiempo necesario para atender tu solicitud o su seguimiento (por ejemplo, un proceso de selección o un proyecto) y se elimina cuando lo pidas, salvo obligación legal de conservarla.']],
      ['Seguridad', ['El sitio se sirve únicamente por HTTPS. No tiene base de datos, cuentas de usuario ni código en servidor que almacene datos personales. El acceso a mis cuentas de correo y mensajería está protegido con autenticación robusta.']],
      ['Tus derechos', ['Según la ley colombiana tienes derecho a conocer, actualizar y rectificar tus datos; solicitar prueba de la autorización; ser informado sobre el uso que se les ha dado; revocar la autorización o solicitar la supresión; acceder gratuitamente a tus datos; y presentar quejas ante la Superintendencia de Industria y Comercio (SIC).', 'Si te aplica el RGPD, también tienes derecho de acceso, rectificación, supresión, limitación, portabilidad y oposición, a retirar tu consentimiento en cualquier momento y a presentar una reclamación ante tu autoridad de protección de datos.']],
      ['Cómo ejercer tus derechos', [`Escribe a ${E} con el asunto "Solicitud de datos" y describe lo que necesitas. Puedo pedirte información para verificar tu identidad.`, 'Las consultas se responden en un máximo de 10 días hábiles y los reclamos en 15 días hábiles, según los artículos 14 y 15 de la Ley 1581. Las solicitudes bajo el RGPD se responden en un plazo de un mes.']],
      ['Menores de edad', ['Este sitio no está dirigido a menores de 14 años (Colombia) ni de 16 (UE), y no recopilo sus datos de forma consciente. Si crees que un menor me envió datos personales, escríbeme y los eliminaré.']],
      ['Enlaces externos', ['Las demos, repositorios, certificados y perfiles se abren en sitios de terceros como Vercel, GitHub, LinkedIn, Credly, freeCodeCamp y Google Drive, con sus propias prácticas de privacidad.']],
      ['Cambios a esta política', ['Si esta política cambia de forma sustancial, publicaré la nueva versión en esta página con nueva fecha de vigencia y número de versión.']],
    ] },
};
class Component extends DCLogic {
  state = { lang: 'en' };
  componentDidMount() { try { const l = localStorage.getItem('da-lang'); if (l === 'es' || l === 'en') this.setState({ lang: l }); } catch (e) {} }
  setLang(l) { this.setState({ lang: l }); try { localStorage.setItem('da-lang', l); } catch (e) {} document.documentElement.lang = l; }
  renderVals() {
    const lang = this.state.lang, d = C[lang];
    return {
      c: { ...d, sections: d.sections.map(([h, ps], i) => { const n = String(i + 1).padStart(2, '0'); return { n, h, ps, id: 's' + n, href: '#s' + n }; }) },
      langs: ['en', 'es'].map(l => ({ label: l.toUpperCase(), active: lang === l, bg: lang === l ? '#FFFFFF' : 'transparent', fg: lang === l ? '#111111' : '#6E6E73', shadow: lang === l ? '0 1px 3px rgba(0,0,0,0.12)' : 'none', set: () => this.setLang(l) })),
    };
  }
}
</script>
</body>
</html>
